<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>

  <div class="card">
    <div class="card-image">
      <img src="assets/images/illustration-article.svg" alt="Drawers Image">
    </div>
    <div class="card-content">
      <p class="card-category">Learning</p>
      <p class="card-publish-date">Published 21 Dec 2023</p>
      <div class="title"></div>
      <h1 class="card-title">HTML & CSS foundations</h1>
      <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      <div class="card-author">
        <img class="author-avatar" src="./assets/images/image-avatar.webp" alt="Michelle Avatar">
        <div class="author-info">
          <p class="author-name">Greg Hooper</p>
        </div>
      </div>
    </div>
  </div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Josedavid Ruiz Herrera</a>.
  </div>
</body>
</html>
